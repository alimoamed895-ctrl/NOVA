<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVA — Your Smart Companion</title>
<style>
:root{--bg:#080b18;--panel:#11182b;--panel2:#171f38;--text:#f7f8ff;--muted:#aab3ca;--line:#293654;--a:#9b5cff;--b:#37c9e8}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at 80% 0,#241652 0,#080b18 48%);color:var(--text)}
.app{height:100vh;display:flex}.side{width:285px;background:#0c1122ee;border-left:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:11px}.logo{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b));font-weight:bold;font-size:23px;box-shadow:0 0 35px #8b5cff55}.brand h1{margin:0}.brand small,.muted{color:var(--muted)}
button{font:inherit;cursor:pointer}.new,.quick{padding:12px;border-radius:14px;color:var(--text)}.new{border:0;background:linear-gradient(135deg,var(--a),#6c68ff);font-weight:bold}.quick{background:var(--panel);border:1px solid var(--line);text-align:right}.quick:hover{border-color:var(--a)}
.free{padding:11px;border:1px solid #245444;background:#0e2524;border-radius:14px;color:#8ff0d2;font-size:13px;line-height:1.7}
.main{flex:1;display:flex;flex-direction:column;min-width:0}.top{height:72px;padding:0 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);background:#0b102299}.online{color:#53e0bb;font-size:13px}
.chat{flex:1;overflow:auto;padding:28px max(18px,calc((100% - 900px)/2))}.welcome{text-align:center;margin:65px auto 25px}.orb{width:92px;height:92px;margin:auto;display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));font-size:32px;font-weight:bold;box-shadow:0 0 55px #8b5cff66}.welcome h2{font-size:30px;margin:15px 0 8px}.welcome p{color:var(--muted);line-height:1.9}
.message{display:flex;gap:10px;margin:18px 0;align-items:flex-start}.message.user{flex-direction:row-reverse}.avatar{width:40px;height:40px;flex:none;border-radius:13px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;font-weight:bold}.user .avatar{background:#3e4961}
.bubble{max-width:82%;padding:14px 17px;background:var(--panel);border:1px solid var(--line);border-radius:18px;line-height:1.95;white-space:pre-wrap}.user .bubble{background:#312660;border-color:#5646a3}.typing{display:none;color:var(--muted);padding:10px}
.bottom{padding:15px max(18px,calc((100% - 900px)/2));border-top:1px solid var(--line);background:#090d1bcc}.inputbox{display:flex;gap:9px;background:var(--panel);padding:9px;border:1px solid var(--line);border-radius:18px}
textarea{flex:1;min-height:46px;max-height:140px;resize:none;border:0;outline:0;background:transparent;color:#fff;padding:10px;font:inherit}.send{width:52px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--a),#6c68ff);color:white;font-size:20px}.send:disabled{opacity:.5}
.note{text-align:center;color:var(--muted);font-size:11px;margin-top:7px}
@media(max-width:760px){.side{display:none}.bubble{max-width:90%}.top{padding:0 15px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<div class="brand"><div class="logo">N</div><div><h1>NOVA</h1><small>Your Smart Companion</small></div></div>
<button id="newChat" class="new">＋ محادثة جديدة</button>
<div class="free">🟢 <b>AI Online</b><br>يمكن استخدامها من الهاتف والكمبيوتر بعد النشر.</div>
<div class="muted" style="font-size:13px">جرب:</div>
<button class="quick" data-q="اشرح لي قانون أوم ببساطة ثم اختبرني">⚡ اشرح واختبرني</button>
<button class="quick" data-q="اعمل لي خطة مذاكرة لمدة 4 ساعات">📚 خطة مذاكرة</button>
<button class="quick" data-q="أنا مش فاهم الفيزياء، ساعديني من البداية">💬 ساعديني</button>
</aside>
<main class="main">
<div class="top"><strong>NOVA AI ✨</strong><span class="online">● متصلة</span></div>
<div id="chat" class="chat">
<div id="welcome" class="welcome"><div class="orb">N</div><h2>أهلًا، أنا NOVA ✨</h2><p>مساعدتك الذكية أينما كنت.<br>هذه الواجهة تعمل على الهاتف والكمبيوتر عند نشرها على الإنترنت.</p></div>
<div id="typing" class="typing">✨ NOVA تفكر...</div>
</div>
<div class="bottom"><div class="inputbox"><textarea id="input" placeholder="اكتب رسالتك إلى NOVA..."></textarea><button id="send" class="send">➤</button></div><div class="note">Enter للإرسال • Shift + Enter لسطر جديد</div></div>
</main>
</div>
<script>
const sessionId=localStorage.getItem("nova_online_sid")||crypto.randomUUID();localStorage.setItem("nova_online_sid",sessionId);
const chat=document.getElementById("chat"),input=document.getElementById("input"),send=document.getElementById("send"),typing=document.getElementById("typing");
function addMessage(text,user=false){document.getElementById("welcome")?.remove();const row=document.createElement("div");row.className="message"+(user?" user":"");const av=document.createElement("div");av.className="avatar";av.textContent=user?"أنت":"N";const bubble=document.createElement("div");bubble.className="bubble";bubble.textContent=text;row.append(av,bubble);chat.insertBefore(row,typing);chat.scrollTop=chat.scrollHeight}
async function sendMessage(){const message=input.value.trim();if(!message||send.disabled)return;addMessage(message,true);input.value="";input.style.height="46px";send.disabled=true;typing.style.display="block";try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sessionId,message})});const d=await r.json();if(!r.ok)throw Error(d.error||"حدث خطأ");addMessage(d.answer)}catch(e){addMessage("حدث خطأ: "+e.message)}finally{typing.style.display="none";send.disabled=false;input.focus()}}
send.addEventListener("click",sendMessage);input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}});input.addEventListener("input",()=>{input.style.height="46px";input.style.height=Math.min(input.scrollHeight,140)+"px"});
document.querySelectorAll(".quick").forEach(b=>b.addEventListener("click",()=>{input.value=b.dataset.q;sendMessage()}));
document.getElementById("newChat").addEventListener("click",async()=>{await fetch("/api/new-chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sessionId})});localStorage.setItem("nova_online_sid",crypto.randomUUID());location.reload()});
</script>
</body>
</html>
