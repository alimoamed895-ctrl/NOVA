```html
<script>
  const chat =
    document.getElementById("chat");

  const input =
    document.getElementById("input");

  const send =
    document.getElementById("send");

  const typing =
    document.getElementById("typing");

  const newChat =
    document.getElementById("newChat");

  const voice =
    document.getElementById("voice");


  let sessionId =
    localStorage.getItem(
      "education_gpt_session"
    );

  if (!sessionId) {
    sessionId =
      crypto.randomUUID();

    localStorage.setItem(
      "education_gpt_session",
      sessionId
    );
  }


  let controller = null;
  let generating = false;


  function addMessage(
    text,
    user
  ) {
    document
      .getElementById("welcome")
      ?.remove();


    const row =
      document.createElement("div");

    row.className =
      "message" +
      (user ? " user" : "");


    const avatar =
      document.createElement("div");

    avatar.className =
      "avatar" +
      (user ? " user-avatar" : "");

    avatar.textContent =
      user ? "أنت" : "✨";


    const body =
      document.createElement("div");

    body.className =
      "message-body";


    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble";

    bubble.textContent =
      text || "";


    body.appendChild(
      bubble
    );


    if (!user) {
      const actions =
        document.createElement("div");

      actions.className =
        "actions";


      const copy =
        document.createElement("button");

      copy.type =
        "button";

      copy.className =
        "copy";

      copy.textContent =
        "نسخ";


      copy.addEventListener(
        "click",
        async () => {
          try {
            await navigator.clipboard.writeText(
              bubble.textContent
            );

            copy.textContent =
              "تم النسخ";

            setTimeout(
              () => {
                copy.textContent =
                  "نسخ";
              },
              1200
            );

          } catch (_) {}
        }
      );


      actions.appendChild(
        copy
      );

      body.appendChild(
        actions
      );
    }


    row.appendChild(
      avatar
    );

    row.appendChild(
      body
    );


    chat.insertBefore(
      row,
      typing
    );


    chat.scrollTop =
      chat.scrollHeight;


    return bubble;
  }


  async function sendMessage() {

    if (generating) {
      stopGeneration();
      return;
    }


    const message =
      input.value.trim();


    if (!message) {
      return;
    }


    addMessage(
      message,
      true
    );


    input.value =
      "";

    input.style.height =
      "48px";


    generating =
      true;


    send.classList.add(
      "stop"
    );

    send.textContent =
      "■";


    typing.style.display =
      "block";


    controller =
      new AbortController();


    try {

      const response =
        await fetch(
          "/api/chat",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                sessionId,
                message
              }),

            signal:
              controller.signal
          }
        );


      if (!response.ok) {

        let errorMessage =
          "حدث خطأ في الخادم.";

        try {
          const data =
            await response.json();

          if (data?.error) {
            errorMessage =
              data.error;
          }
        } catch (_) {

          try {
            const text =
              await response.text();

            if (text) {
              errorMessage =
                text;
            }
          } catch (_) {}
        }


        throw new Error(
          errorMessage
        );
      }


      if (!response.body) {
        throw new Error(
          "لم يصل Stream من الخادم."
        );
      }


      typing.style.display =
        "none";


      const bubble =
        addMessage(
          "",
          false
        );


      const reader =
        response.body.getReader();


      const decoder =
        new TextDecoder(
          "utf-8"
        );


      while (true) {

        const result =
          await reader.read();


        if (result.done) {
          break;
        }


        const text =
          decoder.decode(
            result.value,
            {
              stream: true
            }
          );


        if (!text) {
          continue;
        }


        bubble.textContent +=
          text;


        chat.scrollTop =
          chat.scrollHeight;
      }


      const remaining =
        decoder.decode();


      if (remaining) {
        bubble.textContent +=
          remaining;
      }


      /*
        لا نعرض رسالة
        "لم يصل رد"
        إذا انتهى الـstream بدون نص.
        هذا يمنع ظهور فقاعة إضافية
        مزعجة للمستخدم.
      */

      if (
        !bubble.textContent.trim()
      ) {
        bubble.remove();
      }


    } catch (error) {

      if (
        error.name ===
        "AbortError"
      ) {
        return;
      }


      typing.style.display =
        "none";


      addMessage(
        "حدث خطأ: " +
        error.message,
        false
      );

    } finally {

      generating =
        false;

      controller =
        null;

      typing.style.display =
        "none";

      send.classList.remove(
        "stop"
      );

      send.textContent =
        "➤";

      input.focus();

    }
  }


  function stopGeneration() {

    if (controller) {
      controller.abort();
    }


    controller =
      null;

    generating =
      false;


    typing.style.display =
      "none";


    send.classList.remove(
      "stop"
    );

    send.textContent =
      "➤";
  }


  send.addEventListener(
    "click",
    sendMessage
  );


  input.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();
      }

    }
  );


  input.addEventListener(
    "input",
    () => {

      input.style.height =
        "48px";

      input.style.height =
        Math.min(
          input.scrollHeight,
          160
        ) + "px";

    }
  );


  newChat.addEventListener(
    "click",
    () => {

      stopGeneration();

      localStorage.removeItem(
        "education_gpt_session"
      );

      location.reload();

    }
  );


  document
    .querySelectorAll(
      "[data-prompt]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            input.value =
              button.dataset.prompt;

            input.focus();

            sendMessage();

          }
        );

      }
    );


  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (Recognition) {

    const recognition =
      new Recognition();


    recognition.lang =
      "ar-EG";

    recognition.continuous =
      false;

    recognition.interimResults =
      true;


    voice.addEventListener(
      "click",
      () => {

        try {
          recognition.start();

          voice.textContent =
            "🔴";

        } catch (_) {}

      }
    );


    recognition.onresult =
      event => {

        let text =
          "";


        for (
          let i =
            event.resultIndex;

          i <
            event.results.length;

          i++
        ) {

          text +=
            event.results[i][0].transcript;

        }


        input.value =
          text;


        input.dispatchEvent(
          new Event("input")
        );

      };


    recognition.onend =
      () => {

        voice.textContent =
          "🎙️";

      };


    recognition.onerror =
      () => {

        voice.textContent =
          "🎙️";

      };

  }
</script>
