<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>تسجيل الدخول — Education GPT</title>

  <style>
    :root {
      --bg: #070a14;
      --panel: #0e1529;
      --panel2: #121b34;
      --line: #293965;
      --text: #f7f8ff;
      --muted: #9eabc9;
      --purple: #8b5cf6;
      --blue: #3b82f6;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;

      display: grid;
      place-items: center;

      padding: 20px;

      font-family:
        Tahoma,
        Arial,
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(139, 92, 246, 0.28),
          transparent 32%
        ),
        radial-gradient(
          circle at 85% 90%,
          rgba(59, 130, 246, 0.22),
          transparent 32%
        ),
        var(--bg);
    }

    .page {
      width: 100%;
      max-width: 450px;
    }

    .card {
      width: 100%;

      padding: 32px;

      border-radius: 28px;

      background:
        rgba(14, 21, 41, 0.97);

      border:
        1px solid var(--line);

      box-shadow:
        0 30px 90px rgba(0, 0, 0, 0.48);

      backdrop-filter:
        blur(16px);
    }

    .logo {
      width: 96px;
      height: 96px;

      margin:
        0 auto 20px;

      display: grid;
      place-items: center;

      border-radius: 30px;

      background:
        linear-gradient(
          135deg,
          var(--purple),
          var(--blue)
        );

      box-shadow:
        0 0 55px
        rgba(139, 92, 246, 0.28);
    }

    .logo svg {
      width: 62px;
      height: 62px;
    }

    h1 {
      margin: 0;

      text-align: center;

      font-size: 30px;

      font-weight: 800;
    }

    .subtitle {
      margin:
        9px 0 28px;

      color: var(--muted);

      text-align: center;

      line-height: 1.8;

      font-size: 13px;
    }

    .subtitle strong {
      color: var(--text);
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;

      margin-bottom: 8px;

      color: var(--text);

      font-size: 14px;

      font-weight: 600;
    }

    input {
      width: 100%;

      padding: 14px 15px;

      border-radius: 14px;

      border:
        1px solid var(--line);

      background:
        #091024;

      color: var(--text);

      outline: none;

      font-size: 15px;

      transition:
        0.2s ease;
    }

    input::placeholder {
      color: #7382a6;
    }

    input:focus {
      border-color:
        var(--purple);

      box-shadow:
        0 0 0 3px
        rgba(139, 92, 246, 0.12);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-left: 54px;
    }

    .toggle-password {
      position: absolute;

      left: 8px;
      top: 50%;

      transform:
        translateY(-50%);

      width: 38px;
      height: 38px;

      padding: 0;

      border: 0;

      border-radius: 10px;

      background:
        var(--panel2);

      color:
        var(--muted);

      cursor: pointer;
    }

    .toggle-password:hover {
      color: var(--text);
    }

    .options {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 12px;

      margin-top: 4px;

      font-size: 12px;
    }

    .remember {
      display: flex;

      align-items: center;

      gap: 7px;

      color: var(--muted);

      cursor: pointer;
    }

    .remember input {
      width: auto;

      margin: 0;

      accent-color:
        var(--purple);
    }

    .forgot {
      color:
        #b8a5ff;

      text-decoration:
        none;
    }

    .forgot:hover {
      text-decoration:
        underline;
    }

    .primary-button,
    .guest-button {
      width: 100%;

      min-height: 48px;

      padding:
        13px 16px;

      border-radius:
        14px;

      font-weight:
        800;

      font-size:
        14px;

      cursor:
        pointer;

      transition:
        0.2s ease;
    }

    .primary-button {
      margin-top:
        22px;

      border:
        0;

      color:
        white;

      background:
        linear-gradient(
          135deg,
          var(--purple),
          var(--blue)
        );
    }

    .primary-button:hover {
      filter:
        brightness(1.08);

      transform:
        translateY(-1px);
    }

    .primary-button:disabled {
      opacity:
        0.65;

      cursor:
        wait;

      transform:
        none;
    }

    .divider {
      display: flex;

      align-items: center;

      gap: 12px;

      margin:
        23px 0;

      color:
        var(--muted);

      font-size:
        12px;
    }

    .divider::before,
    .divider::after {
      content: "";

      flex:
        1;

      height:
        1px;

      background:
        var(--line);
    }

    .guest-button {
      border:
        1px solid var(--line);

      background:
        var(--panel2);

      color:
        var(--text);
    }

    .guest-button:hover {
      border-color:
        var(--purple);
    }

    .message {
      min-height:
        22px;

      margin-top:
        12px;

      text-align:
        center;

      font-size:
        13px;

      color:
        #fca5a5;
    }

    .message.success {
      color:
        #86efac;
    }

    .back {
      display:
        block;

      margin-top:
        18px;

      text-align:
        center;

      color:
        var(--muted);

      text-decoration:
        none;

      font-size:
        13px;
    }

    .back:hover {
      color:
        var(--text);
    }

    .footer {
      margin-top:
        16px;

      text-align:
        center;

      color:
        var(--muted);

      opacity:
        0.75;

      font-size:
        11px;
    }

    @media (max-width: 520px) {
      .card {
        padding:
          25px 18px;

        border-radius:
          23px;
      }

      .logo {
        width:
          84px;

        height:
          84px;
      }

      h1 {
        font-size:
          26px;
      }
    }
  </style>

</head>

<body>

  <div class="page">

  <h1>
    تسجيل الدخول
  </h1>

  <div class="subtitle">
    ادخل إلى حسابك في
    <strong>Education GPT</strong>

  <form id="loginForm">

    <div class="field">
      <label for="email">
        البريد الإلكتروني
      </label>

      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="example@email.com"
        required
      >
    </div>

    <div class="field">
      <label for="password">
        كلمة المرور
      </label>

      <div class="password-wrap">

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="••••••••"
          minlength="6"
          required
        >

        <button
          id="togglePassword"
          class="toggle-password"
          type="button"
          aria-label="إظهار كلمة المرور"
        >
          👁
        </button>

      </div>
    </div>

    <div class="options">

      <label class="remember">
        <input
          id="remember"
          type="checkbox"
        >

        <span>
          تذكرني

        id="forgotPassword"
        class="forgot"
        href="#"

      id="loginButton"

</div>

<div class="footer">

  </div>

  <script>
    const form =
      document.getElementById(
        "loginForm"
      );

    const email =
      document.getElementById(
        "email"
      );

    const password =
      document.getElementById(
        "password"
      );

    const remember =
      document.getElementById(
        "remember"
      );

    const loginButton =
      document.getElementById(
        "loginButton"
      );

    const guestButton =
      document.getElementById(
        "guestButton"
      );

    const message =
      document.getElementById(
        "message"
      );

    const togglePassword =
      document.getElementById(
        "togglePassword"
      );

    const forgotPassword =
      document.getElementById(
        "forgotPassword"
      );


    togglePassword.addEventListener(
      "click",
      () => {

        const hidden =
          password.type ===
          "password";

        password.type =
          hidden
            ? "text"
            : "password";

        togglePassword.textContent =
          hidden
            ? "🙈"
            : "👁";

      }
    );


    form.addEventListener(
      "submit",
      event => {

        event.preventDefault();

        message.className =
          "message";

        message.textContent =
          "";

        const emailValue =
          email.value.trim();

        const passwordValue =
          password.value;


        if (!emailValue) {

          message.textContent =
            "اكتب البريد الإلكتروني.";

          return;
        }


        if (
          passwordValue.length < 6
        ) {

          message.textContent =
            "كلمة المرور يجب أن تكون 6 أحرف على الأقل.";

          return;
        }


        /*
          هذه الصفحة حاليًا واجهة تسجيل دخول تجريبية.
          لم يتم ربط Authentication حقيقي أو قاعدة بيانات بعد.
        */

        loginButton.disabled =
          true;

        loginButton.textContent =
          "جارٍ الدخول...";


        localStorage.setItem(
          "education_gpt_user",
          emailValue
        );


        if (
          remember.checked
        ) {

          localStorage.setItem(
            "education_gpt_remember",
            "true"
          );

        } else {

          localStorage.removeItem(
            "education_gpt_remember"
          );

        }


        message.className =
          "message success";

        message.textContent =
          "تم تسجيل الدخول بنجاح.";


        setTimeout(
          () => {

            window.location.href =
              "/";

          },
          450
        );

      }
    );


    guestButton.addEventListener(
      "click",
      () => {

        localStorage.setItem(
          "education_gpt_guest",
          "true"
        );

        window.location.href =
          "/";

      }
    );


    forgotPassword.addEventListener(
      "click",
      event => {

        event.preventDefault();

        message.className =
          "message";

        message.textContent =
          "استرجاع كلمة المرور سيتم ربطه بنظام الحسابات الحقيقي لاحقًا.";

      }
    );
  </script>

</body>
