<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — Education GPT</title>
<style>
:root{--bg:#070a14;--panel:#0e1529;--panel2:#121b34;--line:#293965;--text:#f7f8ff;--muted:#9eabc9;--purple:#8b5cf6;--blue:#3b82f6;--danger:#fca5a5;--ok:#86efac}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Tahoma,Arial,sans-serif;color:var(--text);
background:radial-gradient(circle at 15% 10%,rgba(139,92,246,.28),transparent 32%),radial-gradient(circle at 85% 90%,rgba(59,130,246,.22),transparent 32%),var(--bg)}
.page{width:100%;max-width:450px}
.card{padding:30px;border-radius:28px;background:rgba(14,21,41,.97);border:1px solid var(--line);box-shadow:0 30px 90px rgba(0,0,0,.48)}
.logo{width:84px;height:84px;margin:0 auto 16px;display:grid;place-items:center;border-radius:28px;background:linear-gradient(135deg,var(--purple),var(--blue));box-shadow:0 0 55px rgba(139,92,246,.28)}
.logo svg{width:54px;height:54px}
h1{margin:0;text-align:center;font-size:27px;font-weight:800}
.subtitle{margin:8px 0 20px;color:var(--muted);text-align:center;line-height:1.8;font-size:13px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;margin-bottom:20px;border-radius:16px;background:#091024;border:1px solid var(--line)}
.tab{padding:10px;border:0;border-radius:12px;background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.tab[aria-selected="true"]{color:#fff;background:linear-gradient(135deg,var(--purple),var(--blue))}
.field{margin-bottom:15px}
label{display:block;margin-bottom:7px;font-size:14px;font-weight:600}
input[type=text],input[type=email],input[type=password]{width:100%;padding:13px 15px;border-radius:14px;border:1px solid var(--line);background:#091024;color:var(--text);outline:none;font:inherit;font-size:15px;transition:.2s}
input::placeholder{color:#7382a6}
input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(139,92,246,.15)}
input.bad{border-color:#ef4444}
.pw{position:relative}.pw input{padding-left:54px}
.eye{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:10px;background:var(--panel2);color:var(--muted);cursor:pointer}
.meter{height:5px;margin-top:8px;border-radius:9px;background:#091024;overflow:hidden}
.meter i{display:block;height:100%;width:0;transition:.25s}
.hint{margin-top:5px;font-size:11px;color:var(--muted)}
.options{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px}
.remember{display:flex;align-items:center;gap:7px;color:var(--muted);cursor:pointer}
.remember input{accent-color:var(--purple);margin:0}
.forgot{color:#b8a5ff;text-decoration:none}.forgot:hover{text-decoration:underline}
.btn{width:100%;min-height:48px;padding:13px 16px;border-radius:14px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;transition:.2s}
.primary{margin-top:20px;border:0;color:#fff;background:linear-gradient(135deg,var(--purple),var(--blue))}
.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.primary:disabled{opacity:.65;cursor:wait;transform:none}
.guest{border:1px solid var(--line);background:var(--panel2);color:var(--text)}
.guest:hover{border-color:var(--purple)}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted);font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.message{min-height:22px;margin-top:12px;text-align:center;font-size:13px;color:var(--danger)}
.message.success{color:var(--ok)}
.back{display:block;margin-top:16px;text-align:center;color:var(--muted);text-decoration:none;font-size:13px}.back:hover{color:var(--text)}
.footer{margin-top:14px;text-align:center;color:var(--muted);opacity:.75;font-size:11px}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
@media(max-width:520px){.card{padding:24px 18px;border-radius:23px}h1{font-size:24px}}
</style>
</head>
<body>
<div class="page">
<div class="card">
  <div class="logo">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <path d="M12 37L50 15L88 37L50 59Z" fill="white"/>
      <path d="M25 44V78H75V44L50 59Z" fill="#38bdf8"/>
      <path d="M41 58H59V78H41Z" fill="white"/>
    </svg>
  </div>
  <h1 id="title">تسجيل الدخول</h1>
  <div class="subtitle">ادخل إلى <strong>Education GPT</strong><br>مساعدك الذكي الشامل</div>

  <div class="tabs" role="tablist">
    <button class="tab" id="tabLogin" role="tab" aria-selected="true" type="button">دخول</button>
    <button class="tab" id="tabSignup" role="tab" aria-selected="false" type="button">حساب جديد</button>
  </div>

  <form id="form" novalidate>
    <div class="field" id="nameField" hidden>
      <label for="name">الاسم</label>
      <input id="name" type="text" autocomplete="name" placeholder="اسمك" maxlength="40">
    </div>
    <div class="field">
      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email" autocomplete="email" placeholder="example@email.com" dir="ltr" style="text-align:right">
    </div>
    <div class="field">
      <label for="password">كلمة المرور</label>
      <div class="pw">
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" dir="ltr" style="text-align:right">
        <button id="eye" class="eye" type="button" aria-label="إظهار كلمة المرور">👁</button>
      </div>
      <div id="strength" hidden>
        <div class="meter"><i id="bar"></i></div>
        <div class="hint" id="strengthText"></div>
      </div>
    </div>
    <div class="field" id="confirmField" hidden>
      <label for="confirm">تأكيد كلمة المرور</label>
      <input id="confirm" type="password" autocomplete="new-password" placeholder="••••••••" dir="ltr" style="text-align:right">
    </div>
    <div class="options" id="loginOptions">
      <label class="remember"><input id="remember" type="checkbox"><span>تذكرني</span></label>
      <a id="forgot" class="forgot" href="#">نسيت كلمة المرور؟</a>
    </div>
    <button id="submit" class="btn primary" type="submit">تسجيل الدخول</button>
  </form>

  <div id="message" class="message" role="status" aria-live="polite"></div>
  <div class="divider">أو</div>
  <button id="guest" class="btn guest" type="button">الدخول كزائر</button>
  <a class="back" href="/">← العودة إلى Education GPT</a>
</div>
<div class="footer">Education GPT © 2026</div>
</div>

<script>
const $ = id => document.getElementById(id);
let mode = "login";

function safeSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
function safeDel(k) { try { localStorage.removeItem(k); } catch {} }

function say(text, ok) {
  $("message").className = "message" + (ok ? " success" : "");
  $("message").textContent = text;
}

function setMode(m) {
  mode = m;
  const signup = m === "signup";
  $("tabLogin").setAttribute("aria-selected", String(!signup));
  $("tabSignup").setAttribute("aria-selected", String(signup));
  $("nameField").hidden = !signup;
  $("confirmField").hidden = !signup;
  $("strength").hidden = !signup;
  $("loginOptions").hidden = signup;
  $("title").textContent = signup ? "إنشاء حساب" : "تسجيل الدخول";
  $("submit").textContent = signup ? "إنشاء الحساب" : "تسجيل الدخول";
  $("password").autocomplete = signup ? "new-password" : "current-password";
  say("");
}
$("tabLogin").onclick = () => setMode("login");
$("tabSignup").onclick = () => setMode("signup");

$("eye").onclick = () => {
  const hidden = $("password").type === "password";
  $("password").type = $("confirm").type = hidden ? "text" : "password";
  $("eye").textContent = hidden ? "🙈" : "👁";
};

function score(p) {
  let s = 0;
  if (p.length >= 8) s++;
  if (p.length >= 12) s++;
  if (/[a-z]/.test(p) && /[A-Z]/.test(p)) s++;
  if (/\d/.test(p)) s++;
  if (/[^\w\s]/.test(p)) s++;
  return Math.min(s, 4);
}
$("password").addEventListener("input", () => {
  if (mode !== "signup") return;
  const s = score($("password").value);
  const labels = ["ضعيفة جدًا", "ضعيفة", "مقبولة", "قوية", "قوية جدًا"];
  const colors = ["#ef4444", "#f97316", "#eab308", "#22c55e", "#10b981"];
  $("bar").style.width = ($("password").value ? (s + 1) * 20 : 0) + "%";
  $("bar").style.background = colors[s];
  $("strengthText").textContent = $("password").value ? "قوة كلمة المرور: " + labels[s] : "";
});

function mark(el, bad) { el.classList.toggle("bad", !!bad); return bad; }

$("form").addEventListener("submit", e => {
  e.preventDefault();
  say("");
  const email = $("email").value.trim();
  const pass = $("password").value;
  const name = $("name").value.trim();
  [$("email"), $("password"), $("confirm"), $("name")].forEach(i => i.classList.remove("bad"));

  if (mark($("email"), !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))) return say("اكتب بريد إلكتروني صحيح.");
  if (mark($("password"), pass.length < 6)) return say("كلمة المرور يجب أن تكون 6 أحرف على الأقل.");
  if (mode === "signup") {
    if (mark($("name"), !name)) return say("اكتب اسمك.");
    if (mark($("confirm"), $("confirm").value !== pass)) return say("كلمتا المرور غير متطابقتين.");
  }

  // واجهة تجريبية: لا يوجد تحقق حقيقي ولا تُحفظ كلمة المرور أبدًا.
  // لحسابات حقيقية اربط Supabase / Firebase / Clerk هنا.
  $("submit").disabled = true;
  $("submit").textContent = "جارٍ الدخول...";

  safeSet("education_gpt_user", email);
  safeSet("education_gpt_name", name || email.split("@")[0]);
  safeDel("education_gpt_guest");
  if ($("remember").checked || mode === "signup") safeSet("education_gpt_remember", "true");
  else safeDel("education_gpt_remember");

  say(mode === "signup" ? "تم إنشاء الحساب بنجاح." : "تم تسجيل الدخول بنجاح.", true);
  setTimeout(() => (location.href = "/"), 450);
});

$("guest").onclick = () => {
  safeSet("education_gpt_guest", "true");
  location.href = "/";
};

$("forgot").onclick = e => {
  e.preventDefault();
  say("استرجاع كلمة المرور سيتم ربطه بنظام الحسابات الحقيقي لاحقًا.");
};

// لو فيه جلسة محفوظة: كمّل على طول
try {
  if (localStorage.getItem("education_gpt_remember") === "true" && localStorage.getItem("education_gpt_user")) {
    say("أنت مسجّل دخول بالفعل. جارٍ التحويل...", true);
    setTimeout(() => (location.href = "/"), 600);
  }
} catch {}
</script>
</body>
</html>
