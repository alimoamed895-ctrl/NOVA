<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Education GPT</title>

  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%237c3aed'/%3E%3Cpath d='M12 37L50 15L88 37L50 59Z' fill='white'/%3E%3Cpath d='M25 44V78H75V44L50 59Z' fill='%2338bdf8'/%3E%3Cpath d='M41 58H59V78H41Z' fill='white'/%3E%3C/svg%3E"
  >

  <style>
    :root {
      --bg: #070a14;
      --panel: #0e1529;
      --panel-2: #121b34;
      --line: #293965;
      --text: #f7f8ff;
      --muted: #9eabc9;
      --purple: #8b5cf6;
      --blue: #3b82f6;
      --green: #22c55e;
      --red: #ef4444;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;

      font-family:
        Tahoma,
        Arial,
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 80% 0%,
          rgba(139, 92, 246, 0.24),
          transparent 30%
        ),
        radial-gradient(
          circle at 0% 100%,
          rgba(59, 130, 246, 0.18),
          transparent 32%
        ),
        var(--bg);
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
    }

    .app {
      width: 100%;
      height: 100vh;

      display: flex;
    }

    /* =========================
       SIDEBAR
       ========================= */

    .sidebar {
      width: 290px;
      flex: none;

      padding: 18px;

      display: flex;
      flex-direction: column;

      gap: 12px;

      background:
        rgba(8, 13, 27, 0.97);

      border-left:
        1px solid var(--line);

      overflow-y: auto;
    }

    .brand {
      display: flex;
      align-items: center;

      gap: 12px;
    }

    .brand-logo {
      width: 58px;
      height: 58px;

      flex: none;

      display: grid;
      place-items: center;

      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          var(--purple),
          var(--blue)
        );

      box-shadow:
        0 0 35px
        rgba(139, 92, 246, 0.22);
    }

    .brand-logo svg {
      width: 41px;
      height: 41px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
    }

    .brand-subtitle {
      margin-top: 4px;

      color: var(--muted);

      font-size: 11px;
    }

    .new-chat {
      width: 100%;

      padding: 14px;

      border: 0;
      border-radius: 15px;

      background:
        linear-gradient(
          135deg,
          var(--purple),
          var(--blue)
        );

      color: white;

      font-weight: 800;
    }

    .status {
      padding: 13px;

      border:
        1px solid #1d704b;

      border-radius: 15px;

      background:
        rgba(5, 48, 35, 0.8);

      color: #7df0b7;

      font-size: 13px;

      line-height: 1.7;
    }

    .section-title {
      color: var(--muted);

      font-size: 12px;
    }

    .quick,
    .subject {
      border:
        1px solid var(--line);

      border-radius: 13px;

      background:
        var(--panel);

      color:
        var(--text);

      transition:
        0.2s ease;
    }

    .quick {
      width: 100%;

      padding: 12px;

      text-align: right;
    }

    .quick:hover,
    .subject:hover {
      border-color:
        var(--purple);
    }

    .subjects {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 8px;
    }

    .subject {
      padding:
        10px 8px;

      font-size: 12px;
    }

    .spacer {
      flex: 1;
    }

    .login-link {
      display: block;

      padding:
        12px;

      border:
        1px solid var(--line);

      border-radius:
        13px;

      background:
        var(--panel);

      text-align:
        center;

      text-decoration:
        none;
    }

    /* =========================
       MAIN
       ========================= */

    .main {
      min-width: 0;

      flex: 1;

      display: flex;

      flex-direction:
        column;
    }

    .topbar {
      height:
        70px;

      flex: none;

      padding:
        0 24px;

      display: flex;

      align-items:
        center;

      justify-content:
        space-between;

      border-bottom:
        1px solid var(--line);

      background:
        rgba(7, 10, 20, 0.84);

      backdrop-filter:
        blur(14px);
    }

    .top-brand {
      display: flex;

      align-items:
        center;

      gap:
        10px;
    }

    .top-logo {
      width:
        38px;

      height:
        38px;

      display:
        grid;

      place-items:
        center;

      border-radius:
        12px;

      background:
        linear-gradient(
          135deg,
          var(--purple),
          var(--blue)
        );
    }

    .top-logo svg {
      width:
        27px;

      height:
        27px;
    }

    .top-title {
      font-size:
        18px;

      font-weight:
        800;
    }

    .online {
      color:
        #4ade80;

      font-size:
        13px;
    }

    /* =========================
       CHAT
       ========================= */

    .chat {
      flex:
        1;

      overflow-y:
        auto;

      padding:
        26px
        max(
          15px,
          calc((100% - 920px) / 2)
        );
    }

    .welcome {
      max-width:
        720px;

      margin:
        72px auto 30px;

      text-align:
        center;
    }

    .welcome-logo {
      width:
        105px;

      height:
        105px;

      margin:
        0 auto;

      display:
        grid;

      place-items:
        center;

      border-radius:
        31px;

      background:
        linear-gradient(
          135deg,
          var(--purple),
          var(--blue)
        );

      box-shadow:
        0 0 65px
        rgba(99, 102, 241, 0.28);
    }

    .welcome-logo svg {
      width:
        67px;

      height:
        67px;
    }

    .welcome h1 {
      margin:
        20px 0 8px;

      font-size:
        33px;
    }

    .welcome p {
      margin:
        0;

      color:
        var(--muted);

      line-height:
        1.9;
    }

    .message {
      display:
        flex;

      gap:
        10px;

      margin:
        18px 0;

      align-items:
        flex-start;
    }

    .message.user {
      flex-direction:
        row-reverse;
    }

    .avatar {
      width:
        42px;

      height:
        42px;

      flex:
        none;

      display:
        grid;

      place-items:
        center;

      border-radius:
        14px;

      background:
        linear-gradient(
          135deg,
          var(--purple),
          var(--blue)
        );

      color:
        white;

      font-size:
        12px;

      font-weight:
        800;
    }

    .user-avatar {
      background:
        #3d4864;
    }

    .message-body {
      max-width:
        min(85%, 850px);
    }

    .bubble {
      padding:
        14px 17px;

      border:
        1px solid var(--line);

      border-radius:
        18px;

      background:
        var(--panel);

      line-height:
        1.95;

      white-space:
        pre-wrap;

      overflow-wrap:
        anywhere;

      word-break:
        break-word;
    }

    .message.user .bubble {
      background:
        #30245f;

      border-color:
        #55459d;
    }

    .actions {
      margin-top:
        6px;
    }

    .copy {
      padding:
        5px 9px;

      border:
        1px solid var(--line);

      border-radius:
        8px;

      background:
        var(--panel-2);

      color:
        var(--muted);

      font-size:
        11px;
    }

    .copy:hover {
      color:
        var(--text);

      border-color:
        var(--purple);
    }

    .typing {
      display:
        none;

      padding:
        8px 3px;

      color:
        var(--muted);

      font-size:
        13px;
    }

    .dots span {
      display:
        inline-block;

      width:
        5px;

      height:
        5px;

      margin:
        0 2px;

      border-radius:
        50%;

      background:
        var(--muted);

      animation:
        dot 0.9s infinite;
    }

    .dots span:nth-child(2) {
      animation-delay:
        0.15s;
    }

    .dots span:nth-child(3) {
      animation-delay:
        0.30s;
    }

    @keyframes dot {
      0%,
      100% {
        transform:
          translateY(0);

        opacity:
          0.4;
      }

      50% {
        transform:
          translateY(-4px);

        opacity:
          1;
      }
    }

    /* =========================
       IMAGE
       ========================= */

    .image-preview {
      display:
        none;

      margin:
        0 0 8px;
    }

    .image-preview-box {
      display:
        flex;

      align-items:
        center;

      gap:
        8px;

      width:
        max-content;

      max-width:
        100%;

      padding:
        7px;

      border:
        1px solid var(--line);

      border-radius:
        13px;

      background:
        var(--panel-2);
    }

    .preview-image {
      width:
        68px;

      height:
        68px;

      object-fit:
        cover;

      display:
        block;

      border-radius:
        9px;
    }

    .preview-name {
      max-width:
        180px;

      overflow:
        hidden;

      text-overflow:
        ellipsis;

      white-space:
        nowrap;

      color:
        var(--muted);

      font-size:
        11px;
    }

    .remove-image {
      width:
        32px;

      height:
        32px;

      border:
        0;

      border-radius:
        9px;

      background:
        var(--red);

      color:
        white;

      font-size:
        20px;

      line-height:
        1;
    }

    .user-image {
      width:
        190px;

      max-width:
        100%;

      max-height:
        230px;

      display:
        block;

      margin-bottom:
        8px;

      object-fit:
        cover;

      border-radius:
        12px;

      border:
        1px solid var(--line);
    }
