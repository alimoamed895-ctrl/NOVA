<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Education GPT — Your Smart Study Companion</title>

  <style>
    :root {
      --bg: #060914;
      --panel: #0e1630;
      --panel-2: #121c3d;
      --line: #293b72;
      --text: #f5f7ff;
      --muted: #aab5d1;
      --purple: #8b5cf6;
      --blue: #3b82f6;
      --green: #22c55e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at 80% 0%, #2b1466 0, transparent 32%),
        radial-gradient(circle at 10% 100%, #102a63 0, transparent 30%),
        var(--bg);
      color: var(--text);
    }

    .app {
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: 295px;
      background: rgba(9, 14, 31, 0.94);
      border-left: 1px solid var(--line);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 10px;
    }

    .logo {
      width: 58px;
      height: 58px;
      border-radius: 19px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--purple), var(--blue));
      font-size: 30px;
      box-shadow: 0 0 35px rgba(124, 92, 246, .35);
    }

    .brand h1 {
      margin: 0;
      font-size: 22px;
    }

    .brand span {
      color: var(--muted);
      font-size: 12px;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .new-chat,
    .quick {
      border-radius: 15px;
      padding: 13px;
      color: white;
    }

    .new-chat {
      border: 0;
      font-weight: bold;
      background: linear-gradient(135deg, var(--purple), var(--blue));
    }

    .status {
      border: 1px solid #1e7450;
      background: #0c2924;
      color: #80f2c3;
      border-radius: 15px;
      padding: 13px;
      line-height: 1.7;
      font-size: 13px;
    }

    .quick {
      border: 1px solid var(--line);
      background: var(--panel);
      text-align: right;
    }

    .quick:hover {
      border-color: var(--purple);
    }

    .subjects-title {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .subjects {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .subject {
      border: 1px solid var(--line);
      background: #101a37;
      color: white;
      border-radius: 14px;
      padding: 10px 8px;
      font-size: 12px;
    }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 72px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: rgba(7, 12, 27, .8);
    }

    .top-title {
      font-weight: bold;
      font-size: 18px;
    }

    .online {
      color: #4ade80;
      font-size: 13px;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 28px max(18px, calc((100% - 920px) / 2));
    }

    .welcome {
      text-align: center;
      margin: 60px auto 28px;
    }

    .welcome-logo {
      width: 96px;
      height: 96px;
      margin: auto;
      border-radius: 30px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--purple), var(--blue));
      font-size: 48px;
      box-shadow: 0 0 50px rgba(93, 65, 220, .4);
    }

    .welcome h2 {
      font-size: 31px;
      margin: 16px 0 8px;
    }

    .welcome p {
      color: var(--muted);
      line-height: 1.9;
    }

    .message {
      display: flex;
      gap: 10px;
      margin: 18px 0;
      align-items: flex-start;
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 42px;
      height: 42px;
      flex: none;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--purple), var(--blue));
      font-size: 21px;
    }

    .message.user .avatar {
      background: #3d4962;
      font-size: 16px;
    }

    .bubble {
      max-width: 82%;
      padding: 14px 17px;
      border-radius: 19px;
      border: 1px solid var(--line);
      background: var(--panel);
      line-height: 1.95;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message.user .bubble {
      background: #302466;
      border-color: #5c47ae;
    }

    .typing {
      display: none;
      color: var(--muted);
      padding: 8px 4px;
      font-size: 13px;
    }

    .composer-wrap {
      border-top: 1px solid var(--line);
      background: rgba(7, 12, 27, .92);
      padding: 15px max(18px, calc((100% - 920px) / 2));
    }

    .composer {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      padding: 9px;
      border-radius: 19px;
      background: var(--panel);
      border: 1px solid var(--line);
    }

    textarea {
      flex: 1;
      min-height: 48px;
      max-height: 150px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      padding: 11px;
      font: inherit;
      line-height: 1.6;
    }

    .send {
      width: 54px;
      height: 54px;
      border: 0;
      border-radius: 15px;
      background: linear-gradient(135deg, var(--purple), var(--blue));
      color: white;
      font-size: 22px;
    }

    .send:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .note {
      text-align: center;
      color: #697596;
      font-size: 11px;
      margin-top: 7px;
    }

    @media (max-width: 760px) {
      .sidebar {
        display: none;
      }

      .topbar {
        padding: 0 15px;
      }

      .bubble {
        max-width: 91%;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <aside class="sidebar">

    <div class="brand">
      <div class="logo">📚</div>
      <div>
        <h1>Education GPT</h1>
        <span>Your Smart Study Companion</span>
      </div>
    </div>

    <button id="newChat" class="new-chat">
      ＋ محادثة جديدة
    </button>

    <div class="status">
      🟢 <b>AI Online</b><br>
      Gemini يعمل الآن
    </div>

    <div class="subjects-title">
      أدوات سريعة
    </div>

    <button class="quick" data-q="اشرح لي درسًا بطريقة بسيطة ثم اختبرني">
      ⚡ اشرح واختبرني
    </button>

    <button class="quick" data-q="لخص لي هذا الموضوع بطريقة سهلة للحفظ">
      📄 لخص الموضوع
    </button>

    <button class="quick" data-q="اختبرني في هذا الموضوع سؤالاً سؤالاً">
      ✅ اختبرني
    </button>

    <button class="quick" data-q="اعمل لي خطة مذاكرة مناسبة لليوم">
      📅 خطة مذاكرة
    </button>

    <div class="subjects-title">
      المواد الشائعة
    </div>

    <div class="subjects">
      <button class="subject" data-q="ساعدني في الرياضيات">➗ الرياضيات</button>
      <button class="subject" data-q="ساعدني في العلوم">🧪 العلوم</button>
      <button class="subject" data-q="ساعدني في اللغة العربية">📖 العربية</button>
      <button class="subject" data-q="ساعدني في الإنجليزي">🌍 الإنجليزي</button>
      <button class="subject" data-q="ساعدني في التاريخ">🏛️ التاريخ</button>
      <button class="subject" data-q="ساعدني في البرمجة">💻 البرمجة</button>
    </div>

  </aside>

  <main class="main">

    <header class="topbar">
      <div class="top-title">
        ✨ Education GPT
      </div>

      <div class="online">
        ● متصلة الآن
      </div>
    </header>

    <section id="chat" class="chat">

      <div id="welcome" class="welcome">

        <div class="welcome-logo">
          📚
        </div>

        <h2>
          أهلًا بك في Education GPT ✨
        </h2>

        <p>
          مساعدك التعليمي الذكي.<br>
          أشرح، أناقش، ألخص، أختبرك، وأساعدك في المذاكرة.
        </p>

      </div>

      <div id="typing" class="typing">
        ✨ Education GPT يكتب...
      </div>

    </section>

    <div class="composer-wrap">

      <div class="composer">

        <textarea
          id="input"
          placeholder="اكتب رسالتك إلى Education GPT..."
        ></textarea>

        <button id="send" class="send">
          ➤
        </button>

      </div>

      <div class="note">
        Enter للإرسال • Shift + Enter لسطر جديد
      </div>

    </div>

  </main>

</div>

<script>

const sessionId =
  localStorage.getItem("education_gpt_sid")
  || crypto.randomUUID();

localStorage.setItem(
  "education_gpt_sid",
  sessionId
);

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("input");

const send =
  document.getElementById("send");

const typing =
  document.getElementById("typing");


function addMessage(text, user = false) {

  document.getElementById("welcome")?.remove();

  const row =
    document.createElement("div");

  row.className =
    "message" + (user ? " user" : "");

  const avatar =
    document.createElement("div");

  avatar.className = "avatar";

  avatar.textContent =
    user ? "أنت" : "📚";

  const bubble =
    document.createElement("div");

  bubble.className = "bubble";

  bubble.textContent = text;

  row.appendChild(avatar);
  row.appendChild(bubble);

  chat.insertBefore(row, typing);

  chat.scrollTop = chat.scrollHeight;

  return bubble;
}


async function sendMessage() {

  const message =
    input.value.trim();

  if (!message || send.disabled) {
    return;
  }

  addMessage(message, true);

  input.value = "";
  input.style.height = "48px";

  send.disabled = true;

  typing.style.display = "block";

  try {

    const response =
      await fetch("/api/chat", {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          sessionId,
          message
        })
      });

    if (!response.ok) {

      const errorText =
        await response.text();

      throw new Error(
        errorText || "حدث خطأ في الاتصال"
      );
    }


    document
      .getElementById("welcome")
      ?.remove();


    const row =
      document.createElement("div");

    row.className = "message";


    const avatar =
      document.createElement("div");

    avatar.className = "avatar";

    avatar.textContent = "📚";


    const bubble =
      document.createElement("div");

    bubble.className = "bubble";


    row.appendChild(avatar);
    row.appendChild(bubble);


    chat.insertBefore(row, typing);


    typing.style.display = "none";


    const reader =
      response.body.getReader();

    const decoder =
      new TextDecoder();


    let fullText = "";


    while (true) {

      const { value, done } =
        await reader.read();

      if (done) {
        break;
      }


      const chunk =
        decoder.decode(
          value,
          { stream: true }
        );


      fullText += chunk;

      bubble.textContent =
        fullText;


      chat.scrollTop =
        chat.scrollHeight;

    }

  } catch (error) {

    typing.style.display = "none";

    addMessage(
      "حدث خطأ: " + error.message
    );

  } finally {

    typing.style.display = "none";

    send.disabled = false;

    input.focus();

  }
}


send.addEventListener(
  "click",
  sendMessage
);


input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


input.addEventListener(
  "input",
  () => {

    input.style.height =
      "48px";

    input.style.height =
      Math.min(
        input.scrollHeight,
        150
      ) + "px";

  }
);


document
  .querySelectorAll(
    ".quick, .subject"
  )
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        input.value =
          button.dataset.q;

        sendMessage();

      }
    );

  });


document
  .getElementById("newChat")
  .addEventListener(
    "click",
    async () => {

      try {

        await fetch(
          "/api/new-chat",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              sessionId
            })
          }
        );

      } catch (_) {}

      localStorage.setItem(
        "education_gpt_sid",
        crypto.randomUUID()
      );

      location.reload();

    }
  );

</script>

</body>
</html>
