  <style>
    :root {
      --bg: #070a14;
      --panel: #0e1529;
      --panel2: #121b34;
      --line: #293965;
      --text: #f5f7ff;
      --muted: #9eabc9;
      --purple: #8b5cf6;
      --blue: #3b82f6;
      --green: #22c55e;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;

      font-family:
        Tahoma,
        Arial,
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 80% 0%,
          rgba(139, 92, 246, 0.22),
          transparent 30%
        ),
        radial-gradient(
          circle at 0% 100%,
          rgba(59, 130, 246, 0.16),
          transparent 30%
        ),
        var(--bg);
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      height: 100vh;
      display: flex;
    }

    /* =========================
       SIDEBAR
       ========================= */

    .sidebar {
      width: 300px;
      flex: none;

      padding: 18px;

      display: flex;
      flex-direction: column;
      gap: 13px;

      background: rgba(8, 13, 27, 0.96);

      border-left: 1px solid var(--line);

      overflow-y: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 58px;
      height: 58px;

      display: grid;
      place-items: center;

      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          var(--purple),
          var(--blue)
        );

      box-shadow:
        0 0 35px rgba(124, 92, 246, 0.22);
    }

    .logo svg {
      width: 40px;
      height: 40px;
    }

    .brand-title {
      font-size: 21px;
      font-weight: 800;
    }

    .brand-subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
    }

    .new-chat {
      width: 100%;

      border: 0;
      border-radius: 15px;

      padding: 13px;

      color: white;

      background:
        linear-gradient(
          135deg,
          var(--purple),
          var(--blue)
        );

      font-weight: 800;

      transition: 0.2s ease;
    }

    .new-chat:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .status {
      padding: 13px;

      border-radius: 15px;

      border: 1px solid #1d704b;

      background:
        rgba(5, 48, 35, 0.8);

      color: #7df0b7;

      font-size: 13px;

      line-height: 1.7;
    }

    .section-title {
      color: var(--muted);
      font-size: 12px;
    }

    .quick {
      width: 100%;

      padding: 12px;

      border-radius: 13px;

      border: 1px solid var(--line);

      background: var(--panel);

      color: var(--text);

      text-align: right;

      transition: 0.2s ease;
    }

    .quick:hover {
      border-color: var(--purple);
      transform: translateY(-1px);
    }

    .subjects {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 8px;
    }

    .subject {
      padding: 10px 7px;

      border-radius: 12px;

      border: 1px solid var(--line);

      background: var(--panel2);

      color: var(--text);

      font-size: 12px;

      transition: 0.2s ease;
    }

    .subject:hover {
      border-color: var(--blue);
    }

    .spacer {
      flex: 1;
      min-height: 10px;
    }
