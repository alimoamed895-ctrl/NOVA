<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>تسجيل الدخول — Education GPT</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: grid;
      place-items: center;

      padding: 20px;

      font-family:
        Tahoma,
        Arial,
        sans-serif;

      color: white;

      background:
        radial-gradient(
          circle at 20% 15%,
          rgba(139,92,246,.30),
          transparent 33%
        ),
        radial-gradient(
          circle at 85% 85%,
          rgba(59,130,246,.22),
          transparent 33%
        ),
        #070a14;
    }

    .card {
      width: min(430px, 100%);

      padding: 32px;

      border-radius: 26px;

      background:
        rgba(14,21,41,.97);

      border:
        1px solid #293965;

      box-shadow:
        0 30px 90px rgba(0,0,0,.45);
    }

    .logo {
      width: 92px;
      height: 92px;

      margin:
        0 auto 18px;

      display: grid;
      place-items: center;

      border-radius: 28px;

      background:
        linear-gradient(
          135deg,
          #8b5cf6,
          #3b82f6
        );
    }

    .logo svg {
      width: 58px;
      height: 58px;
    }

    h1 {
      margin: 0;

      text-align: center;

      font-size: 28px;
    }

    .subtitle {
      margin:
        8px 0 28px;

      color: #9eabc9;

      text-align: center;

      line-height: 1.8;
    }

    label {
      display: block;

      margin-bottom: 7px;

      font-size: 14px;
    }

    input {
      width: 100%;

      padding: 14px;

      margin-bottom: 17px;

      border-radius: 13px;

      border:
        1px solid #293965;

      background:
        #091024;

      color:
        white;

      outline:
        none;

      font: inherit;
    }

    input:focus {
      border-color:
        #8b5cf6;
    }

    button {
      width: 100%;

      padding: 14px;

      border: 0;

      border-radius: 14px;

      color: white;

      background:
        linear-gradient(
          135deg,
          #8b5cf6,
          #3b82f6
        );

      font-weight: bold;

      cursor: pointer;
    }

    .guest {
      margin-top: 10px;

      background:
        #121b34;

      border:
        1px solid #293965;
    }

    .back {
      display: block;

      margin-top: 18px;

      text-align: center;

      color: #9eabc9;

      font-size: 13px;
    }

    .message {
      min-height: 20px;

      margin-top: 12px;

      color: #fca5a5;

      text-align: center;

      font-size: 13px;
    }

  </style>

</head>


<body>

<div class="card">

  <div class="logo">

    <svg viewBox="0 0 100 100">

      <path
        d="M12 37L50 15L88 37L50 59Z"
        fill="white"
      />

      <path
        d="M25 44V78H75V44L50 59Z"
        fill="#38bdf8"
      />

    </svg>

  </div>


  <h1>
    تسجيل الدخول
  </h1>


  <div class="subtitle">
    Education GPT
    <br>
    Your Smart Study Companion
  </div>


  <form id="loginForm">

    <label for="email">
      البريد الإلكتروني
    </label>

    <input
      id="email"
      type="email"
      placeholder="example@email.com"
      required
    >


    <label for="password">
      كلمة المرور
    </label>

    <input
      id="password"
      type="password"
      placeholder="••••••••"
      minlength="6"
      required
    >


    <button type="submit">
      تسجيل الدخول
    </button>

  </form>


  <button
    id="guest"
    class="guest"
    type="button"
  >
    الدخول كزائر
  </button>


  <div
    id="message"
    class="message"
  ></div>


  <a
    class="back"
    href="/"
  >
    ← العودة إلى Education GPT
  </a>

</div>


<script>

const form =
  document.getElementById(
    "loginForm"
  );

const guest =
  document.getElementById(
    "guest"
  );

const message =
  document.getElementById(
    "message"
  );


form.addEventListener(
  "submit",
  event => {

    event.preventDefault();

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;


    if (password.length < 6) {

      message.textContent =
        "كلمة المرور يجب أن تكون 6 أحرف على الأقل.";

      return;
    }


    localStorage.setItem(
      "education_gpt_user",
      email
    );

    window.location.href =
      "/";

  }
);


guest.addEventListener(
  "click",
  () => {

    localStorage.setItem(
      "education_gpt_guest",
      "true"
    );

    window.location.href =
      "/";

  }
);

</script>

</body>

</html>
